services:
  - type: web
    name: omnibot
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_MAIN_SERVER_URL
        value: https://main-server-vim3.onrender.com
      - key: VITE_ACCESS_LEVEL
        value: "0"
